name: invalid-free and macOS 13 package test
# Test branch only (not for merge). One FreeWRL at a time on each runner.
#  asan:     world replacement (PROTO worlds) under AddressSanitizer, before and after the fixes
#  package:  build the standalone app for macOS 13 (ad-hoc signed) on a macOS 15 runner
#  pkgtest:  run that same package on macOS 14 and 15 runners
on:
  push:
    branches: [ci/render-loop-invalid-free-test]
  workflow_dispatch:
jobs:
  asan:
    if: ${{ !contains(github.event.head_commit.message, '[skip-asan]') }}
    runs-on: macos-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - {variant: before-fixes, sha: 6416b6fc8b2303f075bdab96c7d1ec9e263db7c8, deps: homebrew}
          - {variant: fix1, sha: ed0bc2072, deps: homebrew}
          - {variant: fix1+2, sha: a0f08d1a5, deps: homebrew}
          - {variant: final-macos13, sha: cb3fc1b46, deps: source}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: environment
        run: sw_vers; xcodebuild -version; sudo DevToolsSecurity -enable || true
      - name: dependencies
        run: |
          git worktree add --detach "$RUNNER_TEMP/src" ${{ matrix.sha }}
          if [ "${{ matrix.deps }}" = homebrew ]; then
            brew install freetype imlib2 openal-soft freealut ode libxml2
            echo "FWDEPS=" >> $GITHUB_ENV
          else
            "$RUNNER_TEMP/src/tools/macos-deps/build.sh" -p "$RUNNER_TEMP/deps" -c "$RUNNER_TEMP/deps-src"
            echo "FWDEPS=FW_DEPS=$RUNNER_TEMP/deps" >> $GITHUB_ENV
          fi
      - name: build (Debug, AddressSanitizer)
        run: |
          xcodebuild -project "$RUNNER_TEMP/src/OSX_gui/FreeWRL-Desktop/FreeWRL.xcodeproj" -scheme FreeWRL \
            -configuration Debug ARCHS=arm64 CODE_SIGN_IDENTITY=- -derivedDataPath "$RUNNER_TEMP/dd" \
            -enableAddressSanitizer YES GCC_OPTIMIZATION_LEVEL=1 'OTHER_CFLAGS=$(inherited) -fsanitize-recover=address' \
            $FWDEPS build > build.log 2>&1 || { tail -40 build.log; exit 1; }
      - name: world-replacement cycles
        run: |
          OUT=$RUNNER_TEMP/out; mkdir -p $OUT
          CYC=3 CSEC=300 TEX=0 tools/ci-invalid-free/suite.sh "$RUNNER_TEMP/dd/Build/Products/Debug/FreeWRL.app" $OUT asan | tee $OUT/results.txt
          { echo "### asan ${{ matrix.variant }} (${{ matrix.sha }})"; echo '```'; grep -hm1 GL_RENDERER $OUT/*.err; cat $OUT/results.txt; echo '```'; } >> $GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: "asan-${{ matrix.variant }}", path: "${{ runner.temp }}/out"}

  package:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: build the package for macOS 13
        run: |
          sw_vers; xcodebuild -version
          git worktree add --detach "$RUNNER_TEMP/src" 5a59c7c1f
          sh "$RUNNER_TEMP/src/tools/macos-package/package.sh" -t 13.0 -z -o "$RUNNER_TEMP/pkg" > package.log 2>&1 || { tail -60 package.log; exit 1; }
          grep -E "embedded|licenses:|Mach-O files|PASS|FAIL|ERROR" package.log
          cp package.log "$RUNNER_TEMP/pkg/"
      - uses: actions/upload-artifact@v4
        with:
          name: package
          path: |
            ${{ runner.temp }}/pkg/FreeWRL-macos-arm64.zip
            ${{ runner.temp }}/pkg/FreeWRL-macos-arm64.zip.sha256
            ${{ runner.temp }}/pkg/package.log

  pkgtest:
    needs: package
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: {name: package, path: pkg}
      - name: unpack
        run: |
          sw_vers; sudo DevToolsSecurity -enable || true
          (cd pkg && shasum -a 256 -c FreeWRL-macos-arm64.zip.sha256)
          ditto -x -k pkg/FreeWRL-macos-arm64.zip "$RUNNER_TEMP/app"
          /usr/libexec/PlistBuddy -c "Print :LSMinimumSystemVersion" "$RUNNER_TEMP/app/FreeWRL.app/Contents/Info.plist"
      - name: smoke fixtures
        run: |
          OUT=$RUNNER_TEMP/out; mkdir -p $OUT
          tools/ci-invalid-free/smoke.sh "$RUNNER_TEMP/app/FreeWRL.app" $OUT | tee $OUT/smoke.txt
      - name: world-replacement cycles and texture stress
        run: |
          OUT=$RUNNER_TEMP/out
          if [ "${{ matrix.os }}" = macos-15 ]; then export CYC=5 CSEC=180 TEX=50 TSEC=40; else export CYC=3 CSEC=180 TEX=10 TSEC=40; fi
          tools/ci-invalid-free/suite.sh "$RUNNER_TEMP/app/FreeWRL.app" $OUT release | tee $OUT/results.txt
          { echo "### package on ${{ matrix.os }} ($(sw_vers -productVersion))"; echo '```'; cat $OUT/smoke.txt $OUT/results.txt; echo '```'; } >> $GITHUB_STEP_SUMMARY
      - name: collect crash reports
        if: always()
        run: mkdir -p $RUNNER_TEMP/out/crash; cp ~/Library/Logs/DiagnosticReports/FreeWRL* $RUNNER_TEMP/out/crash/ 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: "pkgtest-${{ matrix.os }}", path: "${{ runner.temp }}/out"}
